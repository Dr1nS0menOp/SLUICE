# cargo-deny: supply-chain gate (licenses, advisories, bans, sources).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # unsafe-libyaml is archived (unmaintained, no known vulnerability). It comes in through
    # serde_yaml_ng, which vrl 0.36 itself depends on, so it stays as long as Sluice targets
    # Vector 0.59. Moving our own YAML parsing to a safe-Rust parser is on PLAN.md (M12).
    { id = "RUSTSEC-2024-0449", reason = "unmaintained only; required by vrl 0.36 (Vector 0.59)" },
    # zstd 0.13 and zstd-safe 7.3 come in through vrl 0.36's encode_zstd and decode_zstd, and
    # the fixes need zstd 0.14, which vrl 0.36 does not accept. None is reachable: vrl calls
    # only encode_all and decode_all, which make a fresh context each time (0391 is about a
    # reused one passed to with_context) and which 0403 names as unaffected; vrl turns zstd's
    # default features off, so legacy frames (0403) and seekable (0398) are off too; and Sluice
    # never generates either function. Verified 2026-10-26 (docs/notes/vrl.md); drop with vrl.
    { id = "RUSTSEC-2026-0391", reason = "zstd with_context, unused; vrl 0.36 (Vector 0.59)" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe seekable feature, off; vrl 0.36 (Vector 0.59)" },
    { id = "RUSTSEC-2026-0403", reason = "zstd legacy frames, off; decode_all unaffected; vrl 0.36" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list anticipates upcoming dependencies (vrl, rsigma, …); unused entries are fine.
unused-allowed-license = "allow"
# Permissive and weak-copyleft licenses compatible with the project license (AGPL-3.0-only).
# Adding to this list needs a reason in the PR.
allow = [
    "0BSD",          # public-domain equivalent; quoted_printable via vrl
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",       # public-domain dedication; tiny-keccak via rsigma (ahash/const-random)
    "CDLA-Permissive-2.0", # permissive data licence; Mozilla CA list in webpki-roots via ureq
    "ISC",
    "MIT",
    "MIT-0",         # MIT without attribution; borrow-or-share via vrl (jsonschema)
    "MPL-2.0",       # vrl
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
# Our own crates are AGPL-3.0-only (LICENSE) and unpublished; only dependencies are checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
