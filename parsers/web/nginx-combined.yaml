id: nginx/combined
description: "nginx access log in its default `combined` format"
logsource: { product: nginx, category: webserver }
convention: sigma
patterns:
  - regex: '(?P<c_ip>[0-9A-Fa-f.:]+) \S+ (?P<user>\S+) \[(?P<time>[^\]]+)\] "(?P<method>[A-Z]+) (?P<uri>(?P<stem>[^?\s]*)(?:\?(?P<query>\S*))?) (?P<version>[^"]+)" (?P<status>\d{3}) (?P<bytes>\d+|-) "(?P<referer>[^"]*)" "(?P<agent>[^"]*)"'
    fields:
      c_ip: c-ip
      user: cs-username
      method: cs-method
      uri: cs-uri
      stem: cs-uri-stem
      query: cs-uri-query
      version: cs-version
      status: sc-status
      bytes: sc-bytes
      referer: cs-referer
      agent: cs-user-agent
examples:
  - line: '10.10.1.23 - - [10/Oct/2026:08:00:00 +0000] "GET /static/style.css HTTP/1.1" 304 6691 "-" "Mozilla/5.0 (Macintosh)"'
    fields:
      c-ip: 10.10.1.23
      cs-method: GET
      cs-uri-stem: /static/style.css
      cs-uri-query: ~
      sc-status: "304"
      cs-user-agent: Mozilla/5.0 (Macintosh)
  - line: '203.0.113.9 - bob [10/Oct/2026:08:00:01 +0000] "GET /search.php?q=1%27+union+select HTTP/1.1" 200 512 "https://example.com/" "sqlmap/1.8"'
    fields:
      cs-username: bob
      cs-uri: /search.php?q=1%27+union+select
      cs-uri-stem: /search.php
      cs-uri-query: q=1%27+union+select
      cs-referer: https://example.com/
      cs-user-agent: sqlmap/1.8
