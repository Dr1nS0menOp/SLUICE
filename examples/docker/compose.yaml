# Sluice with demo traffic in a container. From the repository root:
#
#   scripts/build-release.sh
#   docker compose -f examples/docker/compose.yaml up --build
#   sluice status                     # sends $SLUICE_CONTROL_TOKEN
#
# The control plane listens on 0.0.0.0 inside the container, so it needs a token (ADR 0010):
#
#   export SLUICE_CONTROL_TOKEN=$(openssl rand -hex 32)
#
# Credentials for real destinations (`sluice connect`) are files under /run/secrets/siem: mount
# them there as Docker secrets or a read-only volume, never put them in sluice.yaml. The demo
# writes to a file, so it needs none.

services:
  sluice:
    build:
      context: ../..
    image: sluice:0.1.0
    command:
      - up
      - --config
      - /etc/sluice/sluice.yaml
      - --rules
      - /etc/sluice/rules/sigma
      - --demo-traffic
    environment:
      - SLUICE_CONTROL_TOKEN
    volumes:
      - ./sluice.yaml:/etc/sluice/sluice.yaml:ro
      - ../rules:/etc/sluice/rules:ro
      - sluice-data:/var/lib/sluice
    ports:
      - "127.0.0.1:8686:8686"
      - "127.0.0.1:9101-9106:9101-9106"
    # Sluice stops Vector gracefully on SIGTERM and waits up to 60 s for it to flush.
    stop_grace_period: 75s
    restart: unless-stopped

volumes:
  sluice-data:
