# `sluice up` example: the demo's six sources dual-shipped to two "SIEMs" (files here) whose rules
# differ, as during a SIEM migration (ADR 0012). Each destination is proven against its own rules:
#
#   sluice up --config examples/up/sluice-dual.yaml --rules examples/rules/sigma \
#     --wazuh-rules examples/rules/wazuh --demo-traffic
#   sluice status --profile sigma
#   sluice status --profile wazuh
#
# The promotion settings are for trying it out; production defaults are 24 hours and 3 proofs.

listen: 127.0.0.1:8686
vector_config: out/dual/vector.yaml
archive_dir: out/dual/archive
data_dir: out/dual/vector-data
tap_rate: 1
cycle_secs: 30

promotion:
  shadow_secs: 60
  min_proofs: 2

sources:
  - id: windows-security
    logsource: { product: windows, service: security }
    format: { kind: json }
    vector: &http
      type: http_server
      address: 127.0.0.1:9101
      decoding: { codec: json }
      framing: { method: newline_delimited }
  - id: sysmon
    logsource: { product: windows, service: sysmon }
    format: { kind: json }
    vector: { <<: *http, address: 127.0.0.1:9102 }
  - id: linux-auth
    logsource: { product: linux, service: auth }
    format: { kind: text, field: message }
    vector: { <<: *http, address: 127.0.0.1:9103 }
  - id: firewall
    logsource: { product: opnsense, service: filterlog, category: firewall }
    format: { kind: json }
    vector: { <<: *http, address: 127.0.0.1:9104 }
  - id: dns
    logsource: { product: unbound, category: dns }
    format: { kind: json }
    vector: { <<: *http, address: 127.0.0.1:9105 }
  - id: nginx
    logsource: { product: nginx, service: access }
    format: { kind: text, field: message }
    vector: { <<: *http, address: 127.0.0.1:9106 }

destinations:
  # The new SIEM, which runs Sigma-derived detections (for example Sentinel).
  new_siem:
    type: file
    path: out/dual/new-siem/%Y-%m-%d-%H.ndjson
    encoding: { codec: json }
    sluice_rules: [sigma]
  # The old SIEM, which runs Wazuh rules.
  old_siem:
    type: file
    path: out/dual/old-siem/%Y-%m-%d-%H.ndjson
    encoding: { codec: json }
    sluice_rules: [wazuh]
