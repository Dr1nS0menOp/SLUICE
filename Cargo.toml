[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# AGPL-3.0-only: see LICENSE and docs/adr/0008-license.md.
license = "AGPL-3.0-only"
repository = "https://github.com/Dr1nS0menOp/SLUICE"
# Not on crates.io: releases are static binaries (ADR 0007).
publish = false

[workspace.dependencies]
# Internal crates
sluice-ai = { path = "crates/sluice-ai" }
sluice-autopilot = { path = "crates/sluice-autopilot" }
sluice-core = { path = "crates/sluice-core" }
sluice-discover = { path = "crates/sluice-discover" }
sluice-elastic = { path = "crates/sluice-elastic" }
sluice-fluentbit = { path = "crates/sluice-fluentbit" }
sluice-http = { path = "crates/sluice-http" }
sluice-kql = { path = "crates/sluice-kql" }
sluice-otel = { path = "crates/sluice-otel" }
sluice-rules = { path = "crates/sluice-rules" }
sluice-sentinel = { path = "crates/sluice-sentinel" }
sluice-splunk = { path = "crates/sluice-splunk" }
sluice-vector = { path = "crates/sluice-vector" }
sluice-wazuh = { path = "crates/sluice-wazuh" }
sluice-synth = { path = "crates/sluice-synth" }

# Third-party (pin young / fast-moving crates exactly; see CLAUDE.md)
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
clap = { version = "4", features = ["derive"] }
proptest = "1"
quick-xml = "0.42"
regex = "1"
rsigma-eval = "=0.24.0"
rustix = { version = "1", features = ["process"] }
# JSON Schema for the recipe spec.
schemars = "1"
rsigma-parser = "=0.24.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
ureq = "3"
vrl = { version = "=0.36.0", default-features = false, features = ["compiler", "stdlib-base"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
