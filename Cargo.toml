[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# AGPL-3.0-only: see LICENSE and docs/adr/0008-license.md.
license = "AGPL-3.0-only"
# TODO(release): set `repository` and decide on publishing to crates.io.
publish = false

[workspace.dependencies]
# Internal crates
sluice-ai = { path = "crates/sluice-ai" }
sluice-archive = { path = "crates/sluice-archive" }
sluice-autopilot = { path = "crates/sluice-autopilot" }
sluice-core = { path = "crates/sluice-core" }
sluice-discover = { path = "crates/sluice-discover" }
sluice-mcp = { path = "crates/sluice-mcp" }
sluice-rules = { path = "crates/sluice-rules" }
sluice-server = { path = "crates/sluice-server" }
sluice-vector = { path = "crates/sluice-vector" }
sluice-wazuh = { path = "crates/sluice-wazuh" }
sluice-synth = { path = "crates/sluice-synth" }

# Third-party (pin young / fast-moving crates exactly; see CLAUDE.md)
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
proptest = "1"
quick-xml = "0.42"
regex = "1"
# MCP Rust SDK: young and fast-moving, pinned (see docs/notes/mcp.md).
rmcp = { version = "=3.5.1", default-features = false, features = ["macros", "server", "transport-io"] }
rsigma-eval = "=0.24.0"
rustix = { version = "1", features = ["process"] }
# JSON Schema for the recipe spec; also what rmcp uses for tool schemas.
schemars = "1"
rsigma-parser = "=0.24.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
vrl = { version = "=0.36.0", default-features = false, features = ["compiler", "stdlib-base"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
