<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="304" viewBox="0 0 1280 304" role="img" aria-label="How Sluice works, from rules and a sample to your tools">
<rect width="1280" height="304" rx="16" fill="#0F181E"/>
<rect x="32" y="40" width="220" height="96" rx="10" fill="#16222A" stroke="#2A3A44" stroke-width="1.5"/>
<text x="50" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E7EEF1" text-anchor="start" letter-spacing="0">Your rules</text>
<text x="50" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">read-only, from the SIEM</text>
<text x="50" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">or from files</text>
<rect x="32" y="168" width="220" height="96" rx="10" fill="#16222A" stroke="#2A3A44" stroke-width="1.5"/>
<text x="50" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E7EEF1" text-anchor="start" letter-spacing="0">A sample</text>
<text x="50" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">an hour or a day,</text>
<text x="50" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">one file per source</text>
<rect x="300" y="40" width="300" height="224" rx="10" fill="#4CB3C6" stroke="#4CB3C6" stroke-width="1.5"/>
<text x="318" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F181E" text-anchor="start" letter-spacing="0">sluice analyze</text>
<text x="318" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F181E" text-anchor="start" letter-spacing="0">sorts events into kinds</text>
<text x="318" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F181E" text-anchor="start" letter-spacing="0">proposes savings (--mode)</text>
<text x="318" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F181E" text-anchor="start" letter-spacing="0">keeps what every rule reads</text>
<text x="318" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F181E" text-anchor="start" letter-spacing="0">proves the same alerts</text>
<text x="318" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F181E" text-anchor="start" letter-spacing="0">on what would be sent</text>
<text x="318" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F181E" text-anchor="start" letter-spacing="0"></text>
<text x="318" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F181E" text-anchor="start" letter-spacing="0">changes nothing itself</text>
<rect x="648" y="40" width="240" height="224" rx="10" fill="#16222A" stroke="#2A3A44" stroke-width="1.5"/>
<text x="666" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E7EEF1" text-anchor="start" letter-spacing="0">What it writes</text>
<text x="666" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">report.html, for people</text>
<text x="666" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">plan.json, for tools</text>
<text x="666" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">vector.yaml</text>
<text x="666" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">Sentinel DCR, ingest</text>
<text x="666" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">pipeline, Fluent Bit, OTel</text>
<rect x="936" y="40" width="312" height="96" rx="10" fill="#16222A" stroke="#2A3A44" stroke-width="1.5"/>
<text x="954" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E7EEF1" text-anchor="start" letter-spacing="0">Your tools</text>
<text x="954" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">you review and deploy;</text>
<text x="954" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">sluice verify checks it later</text>
<rect x="936" y="168" width="148" height="96" rx="10" fill="#16222A" stroke="#2A3A44" stroke-width="1.5"/>
<text x="954" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E7EEF1" text-anchor="start" letter-spacing="0">SIEM</text>
<text x="954" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">less data,</text>
<text x="954" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">same alerts</text>
<rect x="1100" y="168" width="148" height="96" rx="10" fill="#16222A" stroke="#2A3A44" stroke-width="1.5"/>
<text x="1118" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E7EEF1" text-anchor="start" letter-spacing="0">Archive</text>
<text x="1118" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">every event,</text>
<text x="1118" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93A6B0" text-anchor="start" letter-spacing="0">whole</text>
