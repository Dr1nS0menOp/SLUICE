name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Lint, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # The README links this report: it must be what the analysis writes now.
      - run: bash scripts/example-report.sh --check

  vector:
    name: Generated config against the real Vector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/install-vector.sh
      - run: PATH="$HOME/.local/bin:$PATH" bash scripts/vector-check.sh

  elastic:
    name: Generated ingest pipelines against the real Elasticsearch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: docker pull docker.elastic.co/elasticsearch/elasticsearch:9.1.0
      - run: bash scripts/elastic-check.sh

  fluent-bit:
    name: Generated Lua filters against the real Fluent Bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: docker pull fluent/fluent-bit:4.0.3
      - run: bash scripts/fluentbit-check.sh

  otel:
    name: Generated OTTL statements against the real OpenTelemetry Collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: docker pull otel/opentelemetry-collector-contrib:0.128.0
      - run: bash scripts/otel-check.sh

  mcp:
    name: sluice mcp against the official MCP client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.24
      - run: bash scripts/mcp-check.sh

  sigma-differential:
    name: Rule requirements against pySigma (examples and SigmaHQ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pysigma==2.0.0
      - run: bash scripts/sigma-differential.sh
      - run: bash scripts/sigma-differential.sh --sigmahq

  package:
    name: Static binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/install-zig.sh
      - run: PATH="$HOME/.local/bin:$PATH" bash scripts/build-release.sh
      - name: The static binary runs the demo
        run: ./dist/sluice-*-x86_64-unknown-linux-musl demo --scale 2 --out /tmp/demo
      - uses: actions/upload-artifact@v4
        with:
          name: sluice-linux-musl
          path: dist/sluice-*

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
