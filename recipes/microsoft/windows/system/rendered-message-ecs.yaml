id: microsoft/windows/system/rendered-message-ecs
description: Windows System log events as Elastic stores them (ECS), every type
match:
  logsource: { product: windows, service: system }
  schema: ecs
reductions:
  - op: drop_fields
    fields: [message]
  - op: drop_empty_fields
rationale: >-
  In ECS, message is the text Windows renders from the provider's message template and the
  event's own data, which Elastic keeps in winlog.event_data, so it adds no information beyond
  fixed text. Null and empty-string fields carry none either. Rules that match on message, or on
  an empty value, keep these fields through the guardrails.
