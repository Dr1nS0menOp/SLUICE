id: microsoft/windows/application/rendered-message
description: Windows Application log events, every type
match:
  logsource: { product: windows, service: application }
reductions:
  - op: drop_fields
    fields: [Message]
  - op: drop_empty_fields
rationale: >-
  Message is rendered by Windows from the provider's message template and the event's own
  EventData values (or, without a template, a fixed notice listing those values), so it adds no
  information beyond fixed text. Rules that match on Message, or on an empty value, keep these
  fields through the guardrails.