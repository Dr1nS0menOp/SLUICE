id: microsoft/windows/security/local-group-enumerated-eventdata
description: A user's local group membership was enumerated (4798), as a Sentinel SecurityEvent record
match:
  logsource: { product: windows, service: security }
  discriminators: { EventID: "4798" }
reductions:
  - op: drop_fields
    fields: [EventData]
rationale: >-
  In a SecurityEvent record, EventData repeats the event's named data as XML. Every named data
  item of 4798 (the Subject and Target user, domain, SID and logon id, CallerProcessId and
  CallerProcessName) also has its own SecurityEvent column, so the XML adds nothing. Records
  without an EventData field are unchanged. Rules that parse EventData for this event keep it
  through the guardrails.
