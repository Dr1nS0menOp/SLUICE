id: nginx/access/requests
description: nginx access log lines (combined format), read with the nginx/combined parser pack
match:
  logsource: { product: nginx }
  pattern: 'HTTP/<NUM>.<NUM>" <NUM> <NUM> "'
reductions:
  - op: forward_matching
    summary_keys: [host.name, cs-method, sc-status]
rationale: >-
  Routine requests (health checks, static files, API calls) are the bulk of a web server's log.
  Requests a rule could match are forwarded whole; the rest are counted per minute, per host,
  method and status. Give the source `parser: nginx/combined`, so rules on the request's fields
  (cs-uri-query, cs-user-agent) can be read: without it they keep every line.